services:
  web:
    image: node:22-bookworm-slim
    working_dir: /workspace
    env_file:
      - path: ./.env.base44-defaults
        required: true
      # Platform-delivered secrets (user-supplied values always win — listed last).
      - path: /run/base44/app.env
        required: false
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Bind-mount-friendly file watching.
      WATCHPACK_WATCHER_POLLING: "true"
      # Passed through for next.config.mjs (preview origin allowlist, gated on the flag).
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
      BASE44_SANDBOX_HOST_DOMAIN: ${BASE44_SANDBOX_HOST_DOMAIN:-}
    volumes:
      - ${BASE44_PROJECT_ROOT:-.}:/workspace
      - web_node_modules:/workspace/node_modules
    ports:
      - "3000:3000"
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        exec npm run dev -- --hostname 0.0.0.0 --port 3000
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 240s

volumes:
  web_node_modules:
